<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲副本 CD 追蹤與萬年曆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-calendar-days text-indigo-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">遊戲副本 CD 追蹤萬年曆</h1>
        </div>
        <div class="flex items-center gap-4 flex-wrap">
            <!-- 人物篩選 -->
            <div class="flex items-center gap-2">
                <label for="filterCharacter" class="text-sm text-slate-400">人物篩選：</label>
                <select id="filterCharacter" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                    <option value="all">全部人物</option>
                </select>
            </div>
            <!-- 副本篩選 -->
            <div class="flex items-center gap-2">
                <label for="filterDungeon" class="text-sm text-slate-400">副本篩選：</label>
                <select id="filterDungeon" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                    <option value="all">全部副本</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-[1600px] w-full mx-auto">
        
        <!-- 左側管理欄 -->
        <aside class="w-full lg:w-80 flex flex-col gap-4 shrink-0">
            
            <!-- 人物管理 -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col gap-3 shadow-lg">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-base flex items-center gap-2">
                        <i class="fa-solid fa-users text-indigo-400"></i> 人物管理
                    </h2>
                    <button onclick="openBatchModal()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded transition flex items-center gap-1 shrink-0">
                        <i class="fa-solid fa-file-arrow-down"></i> 批次匯入
                    </button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="newCharacterName" placeholder="輸入新人物名稱..." class="flex-1 min-w-0 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                    <button onclick="addCharacter()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded text-sm font-medium transition shrink-0">新增</button>
                </div>
                <div id="characterList" class="max-h-36 overflow-y-auto flex flex-col gap-1.5 pr-1">
                    <!-- 動態帶入人物 -->
                </div>
            </div>

            <!-- 副本與 CD 設定 -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col gap-3 shadow-lg">
                <h2 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i> 副本 CD 設定
                </h2>
                <div class="flex gap-2">
                    <input type="text" id="newDungeonName" placeholder="副本名稱" class="flex-1 min-w-0 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                    <input type="number" id="newDungeonCd" placeholder="CD" min="1" value="1" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm text-center focus:outline-none focus:border-indigo-500 shrink-0">
                    <button onclick="addDungeon()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded text-sm font-medium transition shrink-0">新增</button>
                </div>
                <div id="dungeonList" class="max-h-40 overflow-y-auto flex flex-col gap-1.5 pr-1">
                    <!-- 動態帶入副本 -->
                </div>
            </div>

            <!-- 通關記錄器 -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col gap-3 shadow-lg">
                <h2 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-check text-indigo-400"></i> 通關記錄器
                </h2>
                <div class="flex flex-col gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">選擇副本</label>
                        <select id="recordDungeon" onchange="updateRecordCharacterOptions()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                            <!-- 動態帶入 -->
                        </select>
                    </div>
                    <!-- 新增勾選快速過濾有完成過該副本的人物 -->
                    <div class="flex items-center gap-2 pt-0.5 pb-0.5">
                        <input type="checkbox" id="filterCompletedCharCheckbox" onchange="updateRecordCharacterOptions()" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 w-4 h-4 cursor-pointer">
                        <label for="filterCompletedCharCheckbox" class="text-xs text-slate-300 cursor-pointer select-none">只顯示有完成過該副本的人物</label>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">選擇人物</label>
                        <select id="recordCharacter" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                            <!-- 動態帶入 -->
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">最近通關日期</label>
                        <input type="date" id="recordDate" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="saveRecord()" class="mt-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded text-sm transition">
                        儲存通關記錄
                    </button>
                </div>
            </div>

        </aside>

        <!-- 中間萬年曆區域 -->
        <section class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col shadow-lg">
            <!-- 月份控制列 -->
            <div class="flex justify-between items-center mb-4">
                <button onclick="changeMonth(-1)" class="bg-slate-700 hover:bg-slate-600 px-3.5 py-1.5 rounded text-sm transition">
                    <i class="fa-solid fa-chevron-left mr-1"></i> 上個月
                </button>
                <div class="flex items-center gap-3">
                    <h2 id="calendarTitle" class="text-lg font-bold">2026年 10月</h2>
                    <button onclick="goToToday()" class="text-xs bg-indigo-600/50 hover:bg-indigo-600 text-indigo-200 hover:text-white px-2.5 py-1 rounded transition border border-indigo-500/50">今天</button>
                </div>
                <button onclick="changeMonth(1)" class="bg-slate-700 hover:bg-slate-600 px-3.5 py-1.5 rounded text-sm transition">
                    下個月 <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>

            <!-- 星期標題 -->
            <div class="grid grid-cols-7 gap-1 text-center font-semibold text-sm text-slate-400 mb-2">
                <div class="text-red-400">日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div class="text-blue-400">六</div>
            </div>

            <!-- 日期網格 -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 flex-1 auto-rows-fr">
                <!-- 動態產生 -->
            </div>
        </section>

    </main>

    <!-- 批次匯入 Modal -->
    <div id="batchModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md flex flex-col gap-4 shadow-2xl">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-file-lines text-indigo-400"></i> 批次匯入人物
            </h3>
            <p class="text-xs text-slate-400">請貼上人物名稱，每行代表一個人名。系統會自動略過空白行與重複名稱。</p>
            <textarea id="batchTextarea" rows="6" placeholder="角色A&#10;角色B&#10;角色C" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeBatchModal()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm transition">取消</button>
                <button onclick="confirmBatchImport()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded text-sm font-medium transition">確認匯入</button>
            </div>
        </div>
    </div>

    <!-- 自定義訊息彈窗取代 alert -->
    <div id="msgModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-xs flex flex-col gap-4 shadow-2xl text-center">
            <p id="msgText" class="text-sm text-slate-200"></p>
            <button onclick="closeMsgModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded text-sm font-medium transition w-full">確定</button>
        </div>
    </div>

    <script>
        // 自定義安全訊息框
        function showMessage(text) {
            document.getElementById('msgText').textContent = text;
            const modal = document.getElementById('msgModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeMsgModal() {
            const modal = document.getElementById('msgModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // 資料結構與 LocalStorage 初始化
        let state = {
            characters: JSON.parse(localStorage.getItem('game_characters')) || ['角色1'],
            dungeons: JSON.parse(localStorage.getItem('game_dungeons')) || [
                { name: '莎拉副本', cd: 7 },
                { name: '挑戰古城', cd: 3 },
                { name: '研4副本', cd: 3 },
                { name: '龍影副本', cd: 3 },
                { name: '星座之塔', cd: 3 }
            ],
            records: JSON.parse(localStorage.getItem('game_records')) || {} // { "character_dungeon": "YYYY-MM-DD" }
        };

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0 - 11

        function saveData() {
            localStorage.setItem('game_characters', JSON.stringify(state.characters));
            localStorage.setItem('game_dungeons', JSON.stringify(state.dungeons));
            localStorage.setItem('game_records', JSON.stringify(state.records));
            renderAll();
        }

        // 初始化日期選擇器預設值
        document.getElementById('recordDate').valueAsDate = new Date();

        // 人物管理
        function addCharacter() {
            const input = document.getElementById('newCharacterName');
            const name = input.value.trim();
            if (!name) return;
            if (state.characters.includes(name)) {
                showMessage('該人物已存在！');
                return;
            }
            state.characters.push(name);
            input.value = '';
            saveData();
        }

        function deleteCharacter(name) {
            if (confirm(`確定要刪除人物「${name}」及其相關通關記錄嗎？`)) {
                state.characters = state.characters.filter(c => c !== name);
                Object.keys(state.records).forEach(key => {
                    if (key.startsWith(name + '_')) {
                        delete state.records[key];
                    }
                });
                saveData();
            }
        }

        // 批次匯入
        function openBatchModal() {
            document.getElementById('batchTextarea').value = '';
            document.getElementById('batchModal').classList.remove('hidden');
            document.getElementById('batchModal').classList.add('flex');
        }

        function closeBatchModal() {
            document.getElementById('batchModal').classList.remove('flex');
            document.getElementById('batchModal').classList.add('hidden');
        }

        function confirmBatchImport() {
            const text = document.getElementById('batchTextarea').value;
            const lines = text.split('\n');
            let addedCount = 0;
            lines.forEach(line => {
                const name = line.trim();
                if (name && !state.characters.includes(name)) {
                    state.characters.push(name);
                    addedCount++;
                }
            });
            closeBatchModal();
            saveData();
            showMessage(`成功匯入 ${addedCount} 個新人物！`);
        }

        // 副本管理
        function addDungeon() {
            const nameInput = document.getElementById('newDungeonName');
            const cdInput = document.getElementById('newDungeonCd');
            const name = nameInput.value.trim();
            const cd = parseInt(cdInput.value);

            if (!name) return;
            if (state.dungeons.some(d => d.name === name)) {
                showMessage('該副本名稱已存在！');
                return;
            }
            if (isNaN(cd) || cd < 1) {
                showMessage('請輸入有效的 CD 天數！');
                return;
            }

            state.dungeons.push({ name, cd });
            nameInput.value = '';
            cdInput.value = '1';
            saveData();
        }

        function deleteDungeon(name) {
            if (confirm(`確定要刪除副本「${name}」及其相關通關記錄嗎？`)) {
                state.dungeons = state.dungeons.filter(d => d.name !== name);
                Object.keys(state.records).forEach(key => {
                    if (key.endsWith('_' + name)) {
                        delete state.records[key];
                    }
                });
                saveData();
            }
        }

        // 儲存通關記錄
        function saveRecord() {
            const char = document.getElementById('recordCharacter').value;
            const dung = document.getElementById('recordDungeon').value;
            const date = document.getElementById('recordDate').value;

            if (!char || !dung || !date) {
                showMessage('請完整選擇人物、副本與日期！');
                return;
            }

            const key = `${char}_${dung}`;
            state.records[key] = date;
            saveData();
            showMessage('通關記錄已成功儲存！');
        }

        // 渲染介面
        function renderAll() {
            renderCharacterUI();
            renderDungeonUI();
            renderSelectOptions();
            renderCalendar();
        }

        function renderCharacterUI() {
            const container = document.getElementById('characterList');
            container.innerHTML = state.characters.length === 0 ? '<span class="text-xs text-slate-500 italic">尚無人物</span>' : '';
            state.characters.forEach(c => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900/60 px-3 py-1.5 rounded border border-slate-700/50 text-sm">
                        <span class="truncate mr-2">${c}</span>
                        <button onclick="deleteCharacter('${c}')" class="text-slate-400 hover:text-red-400 transition shrink-0"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                `;
            });
        }

        function renderDungeonUI() {
            const container = document.getElementById('dungeonList');
            container.innerHTML = state.dungeons.length === 0 ? '<span class="text-xs text-slate-500 italic">尚無副本</span>' : '';
            state.dungeons.forEach(d => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900/60 px-3 py-1.5 rounded border border-slate-700/50 text-sm">
                        <span class="truncate mr-2">${d.name} <span class="text-xs text-indigo-400">(CD: ${d.cd}天)</span></span>
                        <button onclick="deleteDungeon('${d.name}')" class="text-slate-400 hover:text-red-400 transition shrink-0"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                `;
            });
        }

        function renderSelectOptions() {
            const filterChar = document.getElementById('filterCharacter');
            const filterDung = document.getElementById('filterDungeon');
            const recordDung = document.getElementById('recordDungeon');

            const prevFilterChar = filterChar.value;
            const prevFilterDung = filterDung.value;
            const prevRecordDung = recordDung.value;

            filterChar.innerHTML = '<option value="all">全部人物</option>';
            state.characters.forEach(c => {
                filterChar.innerHTML += `<option value="${c}">${c}</option>`;
            });

            filterDung.innerHTML = '<option value="all">全部副本</option>';
            recordDung.innerHTML = '';
            state.dungeons.forEach(d => {
                filterDung.innerHTML += `<option value="${d.name}">${d.name}</option>`;
                recordDung.innerHTML += `<option value="${d.name}">${d.name}</option>`;
            });

            if (state.characters.includes(prevFilterChar)) filterChar.value = prevFilterChar;
            if (state.dungeons.some(d => d.name === prevFilterDung)) filterDung.value = prevFilterDung;
            if (state.dungeons.some(d => d.name === prevRecordDung)) recordDung.value = prevRecordDung;

            // 更新通關記錄器的人物選單
            updateRecordCharacterOptions();
        }

        // 根據通關記錄器的副本選擇與勾選狀態，動態渲染「選擇人物」選單
        function updateRecordCharacterOptions() {
            const recordChar = document.getElementById('recordCharacter');
            const recordDung = document.getElementById('recordDungeon');
            const onlyCompleted = document.getElementById('filterCompletedCharCheckbox').checked;
            const selectedDung = recordDung.value;
            const prevRecordChar = recordChar.value;

            recordChar.innerHTML = '';

            let availableChars = state.characters;

            if (onlyCompleted && selectedDung) {
                availableChars = state.characters.filter(c => {
                    const key = `${c}_${selectedDung}`;
                    return state.records[key] !== undefined && state.records[key] !== '';
                });
            }

            if (availableChars.length === 0) {
                recordChar.innerHTML = '<option value="" disabled selected>無符合的人物記錄</option>';
                return;
            }

            availableChars.forEach(c => {
                recordChar.innerHTML += `<option value="${c}">${c}</option>`;
            });

            if (availableChars.includes(prevRecordChar)) {
                recordChar.value = prevRecordChar;
            }
        }

        // 萬年曆邏輯
        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function goToToday() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            renderCalendar();
        }

        function renderCalendar() {
            const title = document.getElementById('calendarTitle');
            title.textContent = `${currentYear}年 ${currentMonth + 1}月`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            const todayStr = new Date().toISOString().split('T')[0];

            const selectedCharFilter = document.getElementById('filterCharacter').value;
            const selectedDungFilter = document.getElementById('filterDungeon').value;

            const targetChars = selectedCharFilter === 'all' ? state.characters : [selectedCharFilter];
            const targetDungs = selectedDungFilter === 'all' ? state.dungeons : state.dungeons.filter(d => d.name === selectedDungFilter);

            let cells = [];

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                cells.push({ type: 'prev', day: dayNum });
            }

            for (let i = 1; i <= totalDays; i++) {
                cells.push({ type: 'current', day: i });
            }

            const totalCells = cells.length <= 35 ? 35 : 42;
            const remaining = totalCells - cells.length;
            for (let i = 1; i <= remaining; i++) {
                cells.push({ type: 'next', day: i });
            }

            cells.forEach(cell => {
                const div = document.createElement('div');
                div.className = "bg-slate-900/40 border border-slate-700/60 rounded-lg p-1.5 flex flex-col gap-1 overflow-hidden min-h-[90px]";

                if (cell.type !== 'current') {
                    div.classList.add('opacity-30');
                }

                let dateStr = '';
                if (cell.type === 'current') {
                    const m = String(currentMonth + 1).padStart(2, '0');
                    const d = String(cell.day).padStart(2, '0');
                    dateStr = `${currentYear}-${m}-${d}`;
                }

                const isToday = dateStr === todayStr;

                div.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold ${isToday ? 'bg-indigo-600 text-white px-1.5 py-0.5 rounded-full' : 'text-slate-300'}">${cell.day}</span>
                    </div>
                    <div class="flex-1 flex flex-col gap-1 overflow-y-auto text-[11px]"></div>
                `;

                const badgesContainer = div.querySelector('div:last-child');

                if (cell.type === 'current' && targetChars.length > 0 && targetDungs.length > 0) {
                    const currentDateObj = new Date(dateStr + 'T00:00:00');

                    targetChars.forEach(char => {
                        targetDungs.forEach(dungObj => {
                            const recordKey = `${char}_${dungObj.name}`;
                            const lastClearDateStr = state.records[recordKey];

                            if (lastClearDateStr) {
                                const lastDateObj = new Date(lastClearDateStr + 'T00:00:00');
                                const diffTime = currentDateObj - lastDateObj;
                                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                                if (diffDays >= 0) {
                                    const daysRemaining = dungObj.cd - diffDays;

                                    if (daysRemaining <= 0) {
                                        badgesContainer.innerHTML += `
                                            <div class="bg-emerald-900/60 border border-emerald-700/50 text-emerald-200 px-1 py-0.5 rounded truncate" title="${char} - ${dungObj.name} 可打">
                                                <span class="font-semibold">${char}</span>:${dungObj.name} <span class="text-emerald-400 font-bold">可打</span>
                                            </div>
                                        `;
                                    } else {
                                        badgesContainer.innerHTML += `
                                            <div class="bg-amber-900/40 border border-amber-700/40 text-amber-200 px-1 py-0.5 rounded truncate" title="${char} - ${dungObj.name} 還要等 ${daysRemaining} 天">
                                                <span class="font-semibold">${char}</span>:${dungObj.name} <span class="text-amber-400">等${daysRemaining}天</span>
                                            </div>
                                        `;
                                    }
                                }
                            }
                        });
                    });
                }

                grid.appendChild(div);
            });
        }

        document.getElementById('filterCharacter').addEventListener('change', renderCalendar);
        document.getElementById('filterDungeon').addEventListener('change', renderCalendar);

        renderAll();
    </script>
</body>
</html>
