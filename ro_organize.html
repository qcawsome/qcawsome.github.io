<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W7WPCHL1Q6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-W7WPCHL1Q6');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8000752958889401"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一鍵複製整理指令</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Noto Sans TC Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased select-none">

    <!-- Card Container -->
    <main class="w-full max-w-md bg-slate-800/90 backdrop-blur-md border border-slate-700/60 rounded-3xl p-8 shadow-2xl text-center transition-all">
        
        <!-- Header Section -->
        <div class="mb-8">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 mb-3 text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                點擊複製工具
            </span>
            <h1 class="text-2xl font-bold text-slate-50 tracking-tight">整理指令產生器</h1>
            <p class="text-xs text-slate-400 mt-2">點擊下方按鈕以複製帶有當前時間戳記的整理指令</p>
        </div>

        <!-- Primary Clickable Button -->
        <div class="my-6">
            <button id="copyBtn" 
                type="button"
                class="w-full py-5 px-6 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-3 cursor-pointer outline-none focus:ring-2 focus:ring-emerald-400/50">
                
                <!-- Icon container -->
                <span id="btnIcon" class="transition-transform duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                </span>
                
                <!-- Button Text -->
                <span id="btnText">點擊複製指令</span>
            </button>
        </div>

        <!-- Copied Result Display Box -->
        <div class="mt-8 pt-6 border-t border-slate-700/50 text-left">
            <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">最新產生的指令：</label>
                <span id="copyToast" class="text-xs text-emerald-400 font-medium opacity-0 transition-opacity duration-300">已成功複製到剪貼簿！</span>
            </div>
            <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3">
                <code id="resultDisplay" class="text-xs sm:text-sm font-mono text-slate-400 break-all select-all flex-1 block">/organize 柚子_yyyyMMddhhmmss.sss</code>
            </div>
        </div>

    </main>

    <!-- Logic Script -->
    <script>
        const copyBtn = document.getElementById('copyBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const resultDisplay = document.getElementById('resultDisplay');
        const copyToast = document.getElementById('copyToast');

        let isCooldown = false;

        // Attach click event handler (handles both desktop mouse click and mobile touch tap)
        copyBtn.addEventListener('click', handleCopyClick);

        function handleCopyClick() {
            if (isCooldown) return;

            const now = new Date();

            // Format timestamp values with zero padding
            const yyyy = now.getFullYear();
            const MM = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const sss = String(now.getMilliseconds()).padStart(3, '0');

            // Construct formatted command text: /organize yyyyMMddhhmmss.sss
            const textToCopy = `/organize ${yyyy}${MM}${dd}${hh}${mm}${ss}.${sss}`;

            // Execute clipboard copy operation
            copyTextToClipboard(textToCopy);

            // Update output display
            resultDisplay.textContent = textToCopy;
            resultDisplay.classList.remove('text-slate-400');
            resultDisplay.classList.add('text-emerald-400', 'font-medium');

            // Trigger visual feedback animations
            showSuccessFeedback();
        }

        /**
         * Clipboard copying with fallback support
         */
        function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(err => {
                    console.error('Clipboard API error, using fallback:', err);
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        }

        /**
         * Fallback mechanism using execCommand for restricted iframe environments
         */
        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Unable to copy text:', err);
            }
            document.body.removeChild(textArea);
        }

        /**
         * Button visual state transformation on success
         */
        function showSuccessFeedback() {
            isCooldown = true;

            // Change button color to success state
            copyBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
            copyBtn.classList.add('bg-slate-700', 'hover:bg-slate-700', 'text-emerald-400');

            // Change icon to checkmark
            btnIcon.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            `;
            btnText.textContent = '已複製到剪貼簿！';

            // Show toast feedback text
            copyToast.classList.remove('opacity-0');

            // Revert back after 1.5 seconds
            setTimeout(() => {
                copyBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                copyBtn.classList.remove('bg-slate-700', 'hover:bg-slate-700', 'text-emerald-400');

                btnIcon.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                `;
                btnText.textContent = '點擊複製指令';
                copyToast.classList.add('opacity-0');
                isCooldown = false;
            }, 1500);
        }
    </script>
</body>
</html>
