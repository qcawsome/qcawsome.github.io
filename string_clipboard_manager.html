<html lang="zh-TW">
<head>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-W7WPCHL1Q6');

     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次字串剪貼簿與管理工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for better look */

            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {

            border-radius: 9999px;

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Toast 提示元件 -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700/50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">提示訊息</span>
    </div>

    <!-- 確認對話框 (Custom Modal to avoid alert/confirm) -->
    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-200 border border-slate-100">
            <div class="w-12 h-12 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-xl mb-4">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 mb-2">確認刪除</h3>
            <p id="modal-desc" class="text-slate-600 text-sm mb-6">您確定要執行這項刪除操作嗎？此動作無法復原。</p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">取消</button>
                <button id="modal-confirm" class="px-4 py-2 rounded-xl text-sm font-medium bg-rose-600 text-white hover:bg-rose-700 shadow-lg shadow-rose-500/20 transition-all">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- 頂部導航列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/30">
                    <i class="fa-solid fa-clipboard-list text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-base sm:text-lg leading-tight">字串剪貼簿管家</h1>
                    <p class="text-xs text-slate-500 hidden sm:block">批次新增、管理與快速複製到剪貼簿</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden sm:inline">匯出備份</span>
                </button>
                <label class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-upload"></i>
                    <span class="hidden sm:inline">匯入資料</span>
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">

        <!-- 區塊一：批次新增字串 -->
        <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-600"></i>
                    批次新增字串
                </h2>
                <span class="text-xs text-slate-400">每行代表一個獨立字串，空白行會自動過濾</span>
            </div>
            <form id="add-form" onsubmit="handleBatchAdd(event)" class="space-y-4">
                <div class="relative">
                    <textarea 
                        id="batch-input" 
                        rows="4" 
                        placeholder="在此貼上或輸入多行字串...&#10;第一行字串&#10;第二行字串&#10;第三行字串"
                        class="w-full rounded-xl border border-slate-200 p-4 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all resize-y placeholder:text-slate-400"
                    ></textarea>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2 text-xs text-slate-500">
                        <i class="fa-solid fa-circle-info text-indigo-500"></i>
                        <span>支援自動去除前後空白，重複項目可選擇略過或保留</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer select-none">
                            <input type="checkbox" id="skip-duplicates" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                            自動略過重複字串
                        </label>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 shadow-md shadow-indigo-600/20 transition-all flex items-center gap-2">
                            <i class="fa-solid fa-check"></i>
                            確認新增
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- 區塊二：清單管理與控制工具列 -->
        <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <!-- 搜尋與統計 -->
                <div class="flex items-center gap-3 flex-grow">
                    <div class="relative flex-grow sm:max-w-xs">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input 
                            type="text" 
                            id="search-input" 
                            oninput="renderList()" 
                            placeholder="搜尋已記錄的字串..." 
                            class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all"
                        >
                    </div>
                    <div class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-2 rounded-xl whitespace-nowrap">
                        共 <span id="total-count" class="text-slate-900 font-bold">0</span> 筆
                    </div>
                </div>

                <!-- 批次動作按鈕 -->
                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="copyAllStrings()" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition-colors flex items-center gap-2 border border-emerald-200/60">
                        <i class="fa-solid fa-copy"></i>
                        全部複製
                    </button>
                    <button onclick="confirmClearAll()" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-rose-50 text-rose-700 hover:bg-rose-100 transition-colors flex items-center gap-2 border border-rose-200/60">
                        <i class="fa-solid fa-trash-can"></i>
                        全部刪除
                    </button>
                </div>
            </div>

            <!-- 字串列表容器 -->
            <div class="overflow-x-auto rounded-xl border border-slate-100">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-3 px-4 w-12 text-center">#</th>
                            <th class="py-3 px-4">字串內容</th>
                            <th class="py-3 px-4 w-40 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="string-tbody" class="divide-y divide-slate-100 text-sm">
                        <!-- 動態插入 -->
                    </tbody>
                </table>
            </div>

            <!-- 空狀態提示 -->
            <div id="empty-state" class="hidden py-16 text-center">
                <div class="w-16 h-16 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center text-2xl mx-auto mb-4">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3 class="text-slate-700 font-medium text-base mb-1">目前沒有記錄任何字串</h3>
                <p class="text-slate-400 text-xs">請透過上方的文字框批次新增您的字串內容。</p>
            </div>
        </section>

    </main>

    <!-- 編輯 Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-200 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                編輯字串
            </h3>
            <input type="hidden" id="edit-index">
            <div class="mb-5">
                <label class="block text-xs font-medium text-slate-500 mb-2">修改內容</label>
                <input type="text" id="edit-input-value" class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">取消</button>
                <button onclick="saveEditedString()" class="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-500/20 transition-all">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
        <p>批次字串剪貼簿管家 &copy; 2026 | 資料安全儲存於您的瀏覽器 LocalStorage 中</p>
    </footer>

    <!-- JavaScript 應用邏輯 -->
    <script>
        const STORAGE_KEY = 'batch_string_manager_data_v1';
        let stringList = [];

        // 初始化載入
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderList();
        });

        // 從 LocalStorage 載入資料
        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    stringList = JSON.parse(data);
                } else {
                    // 預設示範資料
                    stringList = [
                        "https://example.com/api/v1/users",
                        "JWT_SECRET_KEY_SAMPLE_99812",
                        "SELECT * FROM users WHERE status = 'active';",
                        "歡迎使用批次字串剪貼簿管理工具！"
                    ];
                    saveToLocalStorage();
                }
            } catch (e) {
                console.error('載入資料失敗', e);
                stringList = [];
            }
        }

        // 儲存至 LocalStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stringList));
            } catch (e) {
                showToast('儲存失敗，可能是容量超出限制', 'error');
            }
        }

        // 顯示 Toast 提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 批次新增處理
        function handleBatchAdd(e) {
            e.preventDefault();
            const textarea = document.getElementById('batch-input');
            const skipDuplicates = document.getElementById('skip-duplicates').checked;
            const rawText = textarea.value;

            if (!rawText.trim()) {
                showToast('請輸入至少一行字串內容', 'error');
                return;
            }

            // 依換行分割並過濾空行
            const lines = rawText.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
            
            let addedCount = 0;
            lines.forEach(line => {
                if (skipDuplicates && stringList.includes(line)) {
                    return; // 略過重複
                }
                stringList.push(line);
                addedCount++;
            });

            saveToLocalStorage();
            renderList();
            textarea.value = '';
            
            showToast(`成功批次新增 ${addedCount} 筆字串！`);
        }

        // 渲染清單
        function renderList() {
            const tbody = document.getElementById('string-tbody');
            const emptyState = document.getElementById('empty-state');
            const totalCountEl = document.getElementById('total-count');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();

            tbody.innerHTML = '';

            // 篩選符合條件的項目
            const filteredIndices = [];
            stringList.forEach((str, index) => {
                if (str.toLowerCase().includes(searchKeyword)) {
                    filteredIndices.push(index);
                }
            });

            totalCountEl.textContent = stringList.length;

            if (stringList.length === 0 || filteredIndices.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredIndices.forEach((originalIndex, displayIdx) => {
                const str = stringList[originalIndex];
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-colors group';

                // 編號
                const tdNum = document.createElement('td');
                tdNum.className = 'py-3.5 px-4 text-center text-xs text-slate-400 font-mono w-12';
                tdNum.textContent = displayIdx + 1;

                // 內容
                const tdContent = document.createElement('td');
                tdContent.className = 'py-3.5 px-4 font-mono text-slate-700 break-all select-all';
                // 簡易跳脫處理與過長顯示
                tdContent.textContent = str;

                // 操作按鈕
                const tdActions = document.createElement('td');
                tdActions.className = 'py-3.5 px-4 text-right whitespace-nowrap space-x-1';
                tdActions.innerHTML = `
                    <button onclick="copySingleString(${originalIndex})" title="複製" class="p-2 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors">
                        <i class="fa-solid fa-copy text-xs"></i>
                    </button>
                    <button onclick="openEditModal(${originalIndex})" title="編輯" class="p-2 rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 transition-colors">
                        <i class="fa-solid fa-pen text-xs"></i>
                    </button>
                    <button onclick="confirmDelete(${originalIndex})" title="刪除" class="p-2 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                `;

                tr.appendChild(tdNum);
                tr.appendChild(tdContent);
                tr.appendChild(tdActions);
                tbody.appendChild(tr);
            });
        }

        // 單一複製功能
        function copySingleString(index) {
            const textToCopy = stringList[index];
            copyToClipboard(textToCopy, `已複製字串 #${index + 1} 到剪貼簿！`);
        }

        // 全部複製功能
        function copyAllStrings() {
            if (stringList.length === 0) {
                showToast('目前沒有可複製的字串', 'error');
                return;
            }
            const combined = stringList.join('\n');
            copyToClipboard(combined, `已成功複製全部 ${stringList.length} 筆字串！`);
        }

        // 執行剪貼簿複製 (使用相容性良好的 execCommand 作為備援保證)
        function copyToClipboard(text, successMessage) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMessage);
                }).catch(() => {
                    fallbackCopyText(text, successMessage);
                });
            } else {
                fallbackCopyText(text, successMessage);
            }
        }

        function fallbackCopyText(text, successMessage) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';  // 避免捲動
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(successMessage);
                } else {
                    showToast('複製失敗，請手動複製', 'error');
                }
            } catch (err) {
                showToast('瀏覽器不支援自動複製', 'error');
            }
            document.body.removeChild(textarea);
        }

        // 編輯 Modal 控制
        function openEditModal(index) {
            document.getElementById('edit-index').value = index;
            document.getElementById('edit-input-value').value = stringList[index];
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
            document.getElementById('edit-input-value').focus();
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function saveEditedString() {
            const index = parseInt(document.getElementById('edit-index').value);
            const newValue = document.getElementById('edit-input-value').value.trim();

            if (!newValue) {
                showToast('字串內容不能為空', 'error');
                return;
            }

            stringList[index] = newValue;
            saveToLocalStorage();
            renderList();
            closeEditModal();
            showToast('修改成功！');
        }

        // 自定義確認彈窗邏輯 (取代原生 confirm)
        let pendingAction = null;

        function showCustomModal(title, desc, confirmText, callback) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            const confirmBtn = document.getElementById('modal-confirm');
            confirmBtn.textContent = confirmText;
            pendingAction = callback;

            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function hideCustomModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                pendingAction = null;
            }, 200);
        }

        document.getElementById('modal-cancel').addEventListener('click', hideCustomModal);
        document.getElementById('modal-confirm').addEventListener('click', () => {
            if (pendingAction) pendingAction();
            hideCustomModal();
        });

        // 刪除單一項目
        function confirmDelete(index) {
            showCustomModal(
                '確認刪除字串',
                `您確定要刪除第 #${index + 1} 筆字串嗎？`,
                '確認刪除',
                () => {
                    stringList.splice(index, 1);
                    saveToLocalStorage();
                    renderList();
                    showToast('已成功刪除該筆字串');
                }
            );
        }

        // 全部刪除
        function confirmClearAll() {
            if (stringList.length === 0) {
                showToast('清單已經是空的', 'error');
                return;
            }
            showCustomModal(
                '清空所有字串',
                '您確定要清空所有的字串記錄嗎？此操作將無法回復。',
                '全部清空',
                () => {
                    stringList = [];
                    saveToLocalStorage();
                    renderList();
                    showToast('已清空所有字串記錄');
                }
            );
        }

        // 匯出備份 JSON
        function exportData() {
            if (stringList.length === 0) {
                showToast('沒有可匯出的資料', 'error');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stringList, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `strings_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('已成功匯出備份檔案');
        }

        // 匯入備份 JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        showCustomModal(
                            '覆蓋或附加',
                            `成功讀取 ${imported.length} 筆字串。請問要「覆蓋」現有清單，還是「附加」到現有清單後面？`,
                            '覆蓋現有',
                            () => {
                                stringList = imported.map(s => String(s).trim()).filter(s => s);
                                saveToLocalStorage();
                                renderList();
                                showToast('已成功覆蓋匯入資料！');
                            }
                        );
                        // 也可以增加額外選項，此處預設使用確認對話框作覆蓋
                    } else {
                        showToast('匯入格式錯誤，必須是字串陣列 JSON', 'error');
                    }
                } catch (err) {
                    showToast('解析 JSON 檔案失敗', 'error');
                }
                event.target.value = ''; // 重置 input
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
