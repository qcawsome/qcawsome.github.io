<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易靜態 POS 系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: "Microsoft JhengHei", sans-serif; }
        .pos-card { background: white; border-radius: 15px; min-height: 80vh; }
        .numpad-display { font-family: 'Courier New', Courier, monospace; letter-spacing: 2px; }
        .qty-btn-display { min-width: 60px; background-color: #f8f9fa; border: 1px solid #dee2e6; font-weight: bold; }
        .table-v-align td { vertical-align: middle; }
        #barcode-indicator { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; border-radius: 50px; display: none; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="pos-card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary"><i class="fas fa-cash-register me-2"></i>簡易結帳系統</h2>
            <div class="d-flex gap-2">
                <button class="btn btn-primary btn-lg" onclick="openManualModal()">
                    <i class="fas fa-edit me-1"></i> 手動輸入金額
                </button>
                <button class="btn btn-danger btn-lg" onclick="confirmClearCart()">
                    <i class="fas fa-trash-alt me-1"></i> 清空全部
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-v-align">
                <thead class="table-light">
                    <tr>
                        <th>商品名稱</th>
                        <th class="text-end" style="width: 15%;">單價</th>
                        <th class="text-center" style="width: 20%;">數量</th>
                        <th class="text-end" style="width: 15%;">小計</th>
                        <th class="text-center" style="width: 10%;">操作</th>
                    </tr>
                </thead>
                <tbody id="cart-body">
                    </tbody>
                <tfoot class="table-group-divider">
                    <tr class="table-info">
                        <td colspan="3" class="text-end fw-bold fs-4">應收總計：</td>
                        <td class="text-end fw-bold fs-4 text-danger" id="total-amount">0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div id="status-msg" class="alert alert-secondary mt-3 text-center">
            請開始掃描商品條碼或手動輸入金額
        </div>
    </div>
</div>

<div class="modal fade" id="numberPadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold" id="numpad-title">輸入數值</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div id="numpad-display" class="display-4 text-end mb-4 p-3 bg-dark text-white rounded numpad-display shadow-inner">
                    0
                </div>

                <div class="container-fluid p-0">
                    <div class="row g-2 mb-2">
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(1)">1</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(2)">2</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(3)">3</button></div>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(4)">4</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(5)">5</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(6)">6</button></div>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(7)">7</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(8)">8</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(9)">9</button></div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-4"><button class="btn btn-danger btn-lg w-100 py-3" onclick="numPadClear()">C</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark btn-lg w-100 py-3" onclick="numPadAppend(0)">0</button></div>
                        <div class="col-4"><button class="btn btn-warning btn-lg w-100 py-3" onclick="numPadBackspace()"><i class="fas fa-backspace"></i></button></div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" class="btn btn-secondary btn-lg w-100 py-3" data-bs-dismiss="modal">取消</button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-success btn-lg w-100 py-3 fw-bold" onclick="numPadConfirm()">確定</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="barcode-indicator" class="bg-success text-white shadow">掃描中...</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="products.js"></script>

<script>
    // --- 變數宣告 ---
    let products = typeof productsData !== 'undefined' ? productsData : [];
    let carts = [];
    let barcodeBuffer = "";
    let lastKeyTime = Date.now();
    
    // Numpad 相關
    let numPadModal;
    let currentMode = ''; // 'AMOUNT' 或 'QTY'
    let currentItemIndex = null;
    let tempValue = '0';

    // --- 初始化 ---
    document.addEventListener('DOMContentLoaded', () => {
        numPadModal = new bootstrap.Modal(document.getElementById('numberPadModal'));
        if (products.length === 0) {
            updateStatus("警告：未偵測到 products.js 資料庫", "alert-danger");
        }
    });

    // --- 掃描與條碼邏輯 ---
    window.addEventListener('keydown', (e) => {
        // 避免在 Modal 打開時攔截數字鍵，除非你想讓 Modal 也能用鍵盤輸入
        if (document.querySelector('.modal.show')) return;

        const now = Date.now();
        if (now - lastKeyTime > 1000) barcodeBuffer = ""; // 超過 100ms 視為手打，清空 buffer
        lastKeyTime = now;

        if (e.key === 'Enter') {
            if (barcodeBuffer.length >= 2) {
                processBarcode(barcodeBuffer);
                barcodeBuffer = "";
                flashIndicator();
            }
        } else if (e.key.length === 1) {
            barcodeBuffer += e.key;
        }
    });

    function processBarcode(code) {
        const product = products.find(p => p.barcode === code);
        if (product) {
            const existing = carts.find(c => c.product.id === product.id);
            if (existing) {
                existing.size++;
                existing.price = existing.size * product.retailPrice;
            } else {
                carts.push({ product, size: 1, price: product.retailPrice });
            }
            renderCart();
            updateStatus(`已加入：${product.name}`, "alert-success");
        } else {
            updateStatus(`找不到條碼：${code}`, "alert-warning");
        }
    }

    // --- 購物車渲染與操作 ---
    function renderCart() {
        const tbody = document.getElementById('cart-body');
        const totalEl = document.getElementById('total-amount');
        tbody.innerHTML = "";
        let total = 0;

        carts.forEach((item, index) => {
            total += item.price;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="fw-bold">${item.product.name}</td>
                <td class="text-end text-muted">${item.product.retailPrice.toLocaleString()}</td>
                <td>
                    <div class="input-group input-group-sm justify-content-center">
                        <button class="btn btn-outline-secondary px-3" onclick="updateQty(${index}, -1)">-</button>
                        <button class="btn qty-btn-display" onclick="openQtyModal(${index})">${item.size}</button>
                        <button class="btn btn-outline-secondary px-3" onclick="updateQty(${index}, 1)">+</button>
                    </div>
                </td>
                <td class="text-end fw-bold">${item.price.toLocaleString()}</td>
                <td class="text-center">
                    <button class="btn btn-link text-danger p-0" onclick="removeItem(${index})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        totalEl.innerText = total.toLocaleString();
    }

    function updateQty(index, delta) {
        const item = carts[index];
        item.size += delta;
        if (item.size <= 0) {
            removeItem(index);
        } else {
            item.price = item.size * item.product.retailPrice;
            renderCart();
        }
    }

    function removeItem(index) {
        carts.splice(index, 1);
        renderCart();
    }

    function confirmClearCart() {
        if (carts.length > 0) {
            carts = [];
            renderCart();
            updateStatus("清單已清空", "alert-secondary");
        }
    }

    // --- 數字鍵盤 (Modal) 邏輯 ---
    function openManualModal() {
        currentMode = 'AMOUNT';
        tempValue = '0';
        document.getElementById('numpad-title').innerText = '手動輸入金額';
        updateNumPadUI();
        numPadModal.show();
    }

    function openQtyModal(index) {
        currentMode = 'QTY';
        currentItemIndex = index;
        tempValue = carts[index].size.toString();
        document.getElementById('numpad-title').innerText = `修改「${carts[index].product.name}」數量`;
        updateNumPadUI();
        numPadModal.show();
    }

    function numPadAppend(num) {
        if (tempValue === '0') tempValue = num.toString();
        else tempValue += num.toString();
        if (tempValue.length > 9) tempValue = tempValue.substring(0, 9);
        updateNumPadUI();
    }

    function numPadClear() {
        tempValue = '0';
        updateNumPadUI();
    }

    function numPadBackspace() {
        tempValue = tempValue.slice(0, -1);
        if (tempValue === '') tempValue = '0';
        updateNumPadUI();
    }

    function updateNumPadUI() {
        document.getElementById('numpad-display').innerText = tempValue;
    }

    function numPadConfirm() {
        const val = parseInt(tempValue);
        if (currentMode === 'AMOUNT' && val > 0) {
            carts.push({
                product: { id: Date.now(), name: "手動輸入項目", retailPrice: val },
                size: 1,
                price: val
            });
        } else if (currentMode === 'QTY') {
            if (val <= 0) removeItem(currentItemIndex);
            else {
                const item = carts[currentItemIndex];
                item.size = val;
                item.price = item.size * item.product.retailPrice;
            }
        }
        renderCart();
        numPadModal.hide();
    }

    // --- UI 輔助功能 ---
    function updateStatus(msg, className) {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.className = `alert mt-3 text-center ${className}`;
    }

    function flashIndicator() {
        const ind = document.getElementById('barcode-indicator');
        ind.style.display = 'block';
        setTimeout(() => ind.style.display = 'none', 500);
    }
</script>

</body>
</html>
